name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only what the tests need. The full runtime set (langchain, chromadb,
        # sentence-transformers, playwright) is deliberately not installed: the suite
        # mocks those boundaries, and pulling them in would make CI slow and flaky.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # No OPENAI_API_KEY and no GCP credentials are provided. The suite must pass
        # without them; if it does not, it is not usable in CI.
        run: pytest tests/ -v

      - name: Check eval harness runs without an API key
        run: python scripts/run_eval.py --companies ExampleCo --dry-run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy script syntax
        run: |
          for f in gcp/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Reject error-masking patterns in deploy scripts
        # `gcloud ... || echo "already exists"` reported genuine failures as success
        # and hid two sets of invalid flags for months. Matches only that pattern:
        # `|| echo <default>` supplying a fallback value is legitimate.
        run: |
          if grep -rnE '\|\| echo[^|]*exists' gcp/*.sh | grep -vE '^\S+:[0-9]+:\s*#'; then
            echo "::error::found '|| echo ... exists' error masking in gcp/*.sh"
            exit 1
          fi
          echo "no error masking found"

      - name: Reject public bucket grants
        run: |
          if grep -rn 'allUsers' gcp/*.sh | grep -vE '^\S+:[0-9]+:\s*#'; then
            echo "::error::found allUsers IAM grant in gcp/*.sh"
            exit 1
          fi
          echo "no public bucket grants found"
